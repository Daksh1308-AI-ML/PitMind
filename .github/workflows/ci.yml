name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dev deps
        run: uv sync --extra dev
      - name: Ruff check
        run: uv run ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --extra dev
      - name: Generate test fixtures
        run: |
          uv run python synthetic/generator.py
          uv run python tools/fixture_f1.py --drivers '{"VER":1,"LEC":2,"SAI":3}'
      - name: Run tests
        run: uv run pytest -q
      - name: Smoke-test console scripts
        run: uv run pitmind-tune --help >/dev/null
