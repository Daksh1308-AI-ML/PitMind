detection:
  min_brake_pressure: 0.2
  throttle_resume: 0.3
  sample_rate_hz: 60
  corner_curv_threshold: 0.0008
  corner_merge_m: 40.0
  max_brake_lookback_m: 800.0

ranges:
  brake_point_delta_m:
    significant: 3.0
    potential: 10.0
    strong: 15.0
  apex_speed_delta_kmh: 5.0
  throttle_delay_s: 0.1
  exit_speed_delta_kmh: 3.0
  steering_excess: 0.15

timeloss:
  mode: kinematic

# Threshold-tuning knobs for `python -m tools.tune` (flag-rate targets).
tuning:
  target_flag_rate: 0.30   # recommended threshold flags ~30% of samples
  min_flag_pct: 0.10       # reject recommendations that flag less than this
  max_flag_pct: 0.60       # reject recommendations that flag more than this

synthetic:
  laps: 12
  track_kind: monza
  reference_lap_rank: 1

# Race-engineer summariser (todo.md M5 / plan A).
# The LLM is a *display-only* layer: it rephrases the deterministic diagnosis,
# it never decides what a mistake is or how much time it costs (architect.md).
llm:
  provider: ollama        # ollama | off
  base_url: http://localhost:11434
  model: "qwen2.5:7b"     # verified installed (id 845dbda0ea48)
  enabled: false          # default OFF so nothing needs the server; opt-in via
                          #   --summary (tune/f1) or the dashboard toggle.